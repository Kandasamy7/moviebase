server {
    listen 80;
    server_name localhost;

    # Serve static files (Vite/React/Vue build)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;  # Required for SPAs
    }

    # Proxy API requests to backend (adjust if needed)
    location /api {
        proxy_pass http://backend:3000;  # Replace 'backend' with your service name
    }
}